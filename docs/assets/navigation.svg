<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">导航结构</title>
  <desc id="d">官网双语顶栏、游戏内返回与主页下拉导航、标签页三种导航形态。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #8d8d8d; font-size: 12px; }
    .tag { fill: #18d1ff; font-size: 12px; }
  </style>
  <rect width="960" height="560" fill="#121212"/>
  <rect x="0.5" y="0.5" width="959" height="559" fill="none" stroke="#333"/>

  <!-- 官网顶栏 -->
  <text x="40" y="44" class="data tag">01 WEBSITE TOP NAV</text>
  <text x="190" y="44" class="cjk note">官网：英文为主、中文为注；右侧图标区用竖线隔开</text>
  <rect x="40" y="60" width="880" height="72" fill="#000"/>
  <rect x="60" y="80" width="72" height="30" fill="none" stroke="#fff" stroke-opacity=".6"/>
  <text x="96" y="100" text-anchor="middle" class="cjk" font-size="11" fill="#8d8d8d">LOGO</text>
  <g class="cond" font-size="18" fill="#fff">
    <text x="330" y="94">INDEX</text><text x="404" y="94" fill="#18d1ff">INFORMATION</text><text x="532" y="94">OPERATOR</text>
    <text x="636" y="94">WORLD</text><text x="712" y="94">MEDIA</text><text x="784" y="94">MORE</text>
  </g>
  <g class="cjk" font-size="11" font-weight="500" fill="#fff">
    <text x="330" y="112">首页</text><text x="404" y="112" fill="#18d1ff">情报</text><text x="532" y="112">干员</text>
    <text x="636" y="112">设定</text><text x="712" y="112">泰拉万象</text><text x="784" y="112">更多内容</text>
  </g>
  <line x1="856" y1="60" x2="856" y2="132" stroke="#fff" stroke-opacity=".3"/>
  <circle cx="888" cy="96" r="8" fill="none" stroke="#fff"/>

  <!-- 游戏内：实机截图 -->
  <text x="40" y="180" class="data tag">02 IN-GAME BACK / HOME</text>
  <text x="216" y="180" class="cjk note">游戏内：左上角两个并排的直角矩形“返回 + 主页”，主页块展开一条轴线式的快捷导航</text>
  <rect x="40" y="196" width="880" height="184" fill="#1d1f20"/>
  <!-- 返回：142 × 45，细线箭头 -->
  <rect x="40" y="196" width="142" height="45" fill="#313131"/>
  <path d="M74 206 L62 218.5 L74 231" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- 主页：更宽，展开时描一圈白边 -->
  <rect x="185" y="197" width="206" height="43" fill="#424242" stroke="#fff" stroke-width="2"/>
  <path d="M277 220 L288 209 L299 220 V229 H277 Z" fill="none" stroke="#fff" stroke-width="2"/>
  <polygon points="306,216 314,216 310,221" fill="#fff"/>
  <!-- 快捷导航：半透明带、轴线、节点，名称上下交错 -->
  <rect x="40" y="246" width="640" height="128" fill="#000" fill-opacity=".85"/>
  <line x1="40" y1="310" x2="680" y2="310" stroke="#fff" stroke-opacity=".3"/>
  <g fill="#000" stroke="#fff">
    <circle cx="100" cy="310" r="6"/><circle cx="200" cy="310" r="6"/><circle cx="400" cy="310" r="6"/>
    <circle cx="500" cy="310" r="6"/><circle cx="600" cy="310" r="6"/>
  </g>
  <g fill="#fff">
    <circle cx="100" cy="310" r="1.5"/><circle cx="200" cy="310" r="1.5"/><circle cx="400" cy="310" r="1.5"/>
    <circle cx="500" cy="310" r="1.5"/><circle cx="600" cy="310" r="1.5"/>
  </g>
  <g fill="none" stroke="#18d1ff">
    <circle cx="300" cy="310" r="6" fill="#000"/><circle cx="300" cy="310" r="14"/><circle cx="300" cy="310" r="22" stroke-opacity=".4"/>
  </g>
  <circle cx="300" cy="310" r="1.5" fill="#18d1ff"/>
  <g stroke="#fff" stroke-opacity=".6" stroke-dasharray="2 2">
    <line x1="100" y1="320" x2="100" y2="330"/><line x1="200" y1="300" x2="200" y2="290"/>
    <line x1="400" y1="300" x2="400" y2="290"/><line x1="500" y1="320" x2="500" y2="330"/><line x1="600" y1="300" x2="600" y2="290"/>
  </g>
  <line x1="300" y1="334" x2="300" y2="340" stroke="#18d1ff" stroke-opacity=".6" stroke-dasharray="2 2"/>
  <g class="cjk" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="100" y="346">首页</text><text x="200" y="284">编队</text><text x="300" y="356" fill="#18d1ff">干员</text>
    <text x="400" y="284">作战</text><text x="500" y="346">基建</text><text x="600" y="284">采购中心</text>
  </g>
  <!-- 图标：占位的几何图形，在名称的外侧 -->
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <path d="M100 353l6 6-6 6-6-6z"/><rect x="194" y="256" width="12" height="12"/>
    <rect x="394" y="256" width="12" height="12"/><rect x="494" y="353" width="12" height="12"/><path d="M594 256h12v8l-6 6-6-6z"/>
  </g>
  <g class="data" font-size="12" fill="#fff" text-anchor="end">
    <text x="900" y="222">龙门币 128,400   合成玉 6,000   理智 131/135</text>
  </g>

  <!-- 标签页 -->
  <text x="40" y="424" class="data tag">03 TABS</text>
  <text x="96" y="424" class="cjk note">标签页：选中项变成信号色实心块（官网）；或以 4px 底条指示；游戏内每一项都有底块，选中明暗对调</text>
  <rect x="40" y="444" width="90" height="20" fill="#18d1ff"/>
  <text x="43" y="459" class="cjk" font-size="14" font-weight="700" fill="#000">最新</text>
  <path d="M116 447l7 7-7 7v-4l3-3-3-3z" fill="#000"/>
  <g class="cjk" font-size="14" font-weight="700" fill="#fff">
    <text x="149" y="459">公告</text><text x="255" y="459">活动</text><text x="361" y="459">新闻</text>
  </g>
  <g class="cjk" font-size="13" font-weight="700" text-anchor="middle">
    <text x="520" y="461" fill="#18d1ff">全部</text><text x="600" y="461" fill="#ababab">近卫</text><text x="680" y="461" fill="#ababab">狙击</text><text x="760" y="461" fill="#ababab">术师</text><text x="840" y="461" fill="#ababab">医疗</text>
  </g>
  <line x1="480" y1="476" x2="880" y2="476" stroke="#fff" stroke-opacity=".3"/>
  <rect x="490" y="473" width="60" height="4" fill="#18d1ff"/>

  <g>
    <rect x="40" y="496" width="72" height="34" fill="#fff" fill-opacity=".1"/><rect x="114" y="496" width="88" height="34" fill="#fff" fill-opacity=".1"/>
    <rect x="204" y="496" width="104" height="34" fill="#fff" fill-opacity=".1"/><rect x="310" y="496" width="104" height="34" fill="#fff"/>
  </g>
  <g class="cjk" font-size="14" font-weight="700" text-anchor="middle">
    <text x="76" y="518" fill="#d2d2d2">全部</text><text x="158" y="518" fill="#d2d2d2">消耗品</text><text x="256" y="518" fill="#d2d2d2">基础物品</text><text x="362" y="518" fill="#000">养成材料</text>
  </g>
</svg>

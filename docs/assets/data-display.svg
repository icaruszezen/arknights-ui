<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">数据展示：新闻行、数值、进度、星级</title>
  <desc id="d">新闻列表行的三栏结构，以及数值、进度条、标签、星级的写法。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #8d8d8d; font-size: 12px; }
    .tag { fill: #18d1ff; font-size: 12px; }
    .lead { stroke: #585858; stroke-width: 1; fill: none; }
  </style>
  <rect width="960" height="360" fill="#121212"/>
  <rect x="0.5" y="0.5" width="959" height="359" fill="none" stroke="#333"/>

  <text x="40" y="44" class="data tag">01 NEWS ROW</text>
  <text x="140" y="44" class="cjk note">分类 / 日期 / 标题各占一格，行间 1px 白 30% 细线</text>
  <rect x="40" y="60" width="480" height="188" fill="#000"/>
  <g>
    <text x="60" y="110" class="cjk" font-size="15" font-weight="700" fill="#18d1ff">活动</text>
    <text x="120" y="94" class="data" font-size="13" fill="#d2d2d2" letter-spacing="1">2026 // 10 / 03</text>
    <text x="120" y="116" class="cjk" font-size="15" font-weight="700" fill="#d2d2d2" letter-spacing="2">SideStory 限时活动即将开启</text>
    <line x1="60" y1="140" x2="500" y2="140" stroke="#fff" stroke-opacity=".3"/>
    <text x="60" y="190" class="cjk" font-size="15" font-weight="700" fill="#18d1ff">公告</text>
    <text x="120" y="174" class="data" font-size="13" fill="#d2d2d2" letter-spacing="1">2026 // 09 / 29</text>
    <text x="120" y="196" class="cjk" font-size="15" font-weight="700" fill="#d2d2d2" letter-spacing="2">09月29日16:00闪断更新公告</text>
    <line x1="60" y1="220" x2="500" y2="220" stroke="#fff" stroke-opacity=".3"/>
  </g>
  <path class="lead" d="M76 200 V268 H40"/><text x="40" y="286" class="cjk note">分类：青蓝，1.125rem Bold</text>
  <path class="lead" d="M258 166 H372 V258"/><text x="236" y="272" class="cjk note">日期：伪等宽，“//” 与 “/” 混用，字距 1px</text>
  <path class="lead" d="M400 204 V306 H384"/><text x="236" y="310" class="cjk note">标题：Bold，字距 2px，最多两行</text>

  <text x="560" y="44" class="data tag">02 VALUE</text>
  <text x="626" y="44" class="cjk note">大数字 + 小单位 + 分母</text>
  <text x="560" y="104" class="data" font-size="48" font-weight="700" fill="#fff">131</text>
  <text x="652" y="104" class="data" font-size="20" fill="#ababab">/135</text>
  <text x="560" y="124" class="cond" font-size="12" fill="#8d8d8d" letter-spacing="1">SANITY · 理智</text>
  <text x="760" y="104" class="data" font-size="48" font-weight="700" fill="#18d1ff">01</text>
  <text x="820" y="86" class="data" font-size="14" fill="#fff">// 05</text>

  <text x="560" y="172" class="data tag">03 PROGRESS</text>
  <!-- 官网轮播：轨道与进度同高，进度段停在当前页 -->
  <rect x="560" y="184" width="360" height="8" fill="#ababab"/>
  <rect x="632" y="184" width="72" height="8" fill="#18d1ff"/>
  <!-- 加载：1px 轨道 + 4px 进度 -->
  <rect x="560" y="205.5" width="360" height="1" fill="#fff" fill-opacity=".3"/>
  <rect x="560" y="204" width="150" height="4" fill="#18d1ff"/>
  <rect x="560" y="220" width="360" height="10" fill="#333"/>
  <rect x="560" y="220" width="250" height="10" fill="#ffd802"/>
  <g fill="#121212"><rect x="630" y="220" width="2" height="10"/><rect x="702" y="220" width="2" height="10"/><rect x="774" y="220" width="2" height="10"/><rect x="846" y="220" width="2" height="10"/></g>
  <text x="920" y="248" text-anchor="end" class="data" font-size="12" fill="#ababab">EXP 2,480 / 3,600</text>

  <text x="560" y="276" class="data tag">04 TAG / STAR / BADGE</text>
  <!-- 标签：天赋用实心白底，定位用深色块（实机） -->
  <rect x="560" y="292" width="56" height="22" fill="#fff"/>
  <text x="588" y="308" text-anchor="middle" class="cjk" font-size="12" font-weight="700" fill="#000">领袖</text>
  <rect x="622" y="292" width="64" height="22" fill="#424242"/>
  <text x="654" y="308" text-anchor="middle" class="cjk" font-size="12" fill="#fff">近战位</text>
  <!-- 星：偏柠檬的黄，后一颗压住前一颗约两成，各带一圈深色硬边 -->
  <g fill="#f1d94a" stroke="#000" stroke-opacity=".55" stroke-width="1" paint-order="stroke">
    <polygon points="712,296 715,303 722,303 716,307 719,314 712,310 705,314 708,307 702,303 709,303"/>
    <polygon points="729,296 732,303 739,303 733,307 736,314 729,310 722,314 725,307 719,303 726,303"/>
    <polygon points="746,296 749,303 756,303 750,307 753,314 746,310 739,314 742,307 736,303 743,303"/>
    <polygon points="763,296 766,303 773,303 767,307 770,314 763,310 756,314 759,307 753,303 760,303"/>
    <polygon points="780,296 783,303 790,303 784,307 787,314 780,310 773,314 776,307 770,303 777,303"/>
  </g>
  <!-- 提醒标记：橙色菱形带白边，骑在角上；计数：直角色块，白色图标加数字 -->
  <rect x="812" y="296" width="40" height="18" fill="none" stroke="#fff" stroke-opacity=".5"/>
  <path d="M852 289l7 7-7 7-7-7z" fill="#ff5e19" stroke="#fff"/>
  <rect x="872" y="292" width="46" height="22" fill="#a32339"/>
  <path d="M879 309l5.5-11 5.5 11z" fill="#fff"/>
  <text x="904" y="308" text-anchor="middle" class="data" font-size="13" font-weight="700" fill="#fff">1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">反馈元素</title>
  <desc id="d">确认弹窗、提示条、加载指示与空状态的结构。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #8d8d8d; font-size: 12px; }
    .tag { fill: #18d1ff; font-size: 12px; }
  </style>
  <defs>
    <pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="12" fill="#ffd802"/><rect x="6" width="6" height="12" fill="#121212"/></pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000" fill-opacity=".15"/></pattern>
  </defs>
  <rect width="960" height="440" fill="#121212"/>
  <rect x="0.5" y="0.5" width="959" height="439" fill="none" stroke="#333"/>

  <!-- 弹窗 -->
  <text x="40" y="44" class="data tag">01 DIALOG</text>
  <text x="112" y="44" class="cjk note">通栏横带式弹窗：内容带 + 底部左右对开的按钮</text>
  <rect x="40" y="64" width="480" height="230" fill="#000" fill-opacity=".6"/>
  <rect x="40" y="120" width="480" height="84" fill="#313131" fill-opacity=".95"/>
  <rect x="40" y="120" width="480" height="2" fill="#fff" fill-opacity=".2"/>
  <text x="280" y="158" text-anchor="middle" class="cjk" font-size="16" fill="#fff">是否消耗 1 份应急理智合剂恢复理智？</text>
  <text x="280" y="182" text-anchor="middle" class="data" font-size="12" fill="#ababab">SANITY 12/135 → 92/135</text>
  <rect x="40" y="204" width="240" height="44" fill="#424242"/>
  <rect x="280" y="204" width="240" height="44" fill="#fdfdfb"/>
  <rect x="280" y="204" width="240" height="44" fill="url(#dots)"/>
  <text x="160" y="231" text-anchor="middle" class="cjk" font-size="14" font-weight="700" fill="#fff">✕ 取消</text>
  <text x="400" y="231" text-anchor="middle" class="cjk" font-size="14" font-weight="700" fill="#323232">✓ 确认</text>
  <text x="40" y="318" class="cjk note">· 遮罩：黑 50–60%，可叠加背景模糊</text>
  <text x="40" y="338" class="cjk note">· 弹窗不做居中小方框，而是横贯屏幕的一条带</text>
  <text x="40" y="358" class="cjk note">· 确认 = 浅色块在右，取消 = 深色块在左</text>

  <!-- 提示条 -->
  <text x="560" y="44" class="data tag">02 NOTICE</text>
  <text x="630" y="44" class="cjk note">提示条：左侧色条表达级别</text>
  <rect x="560" y="64" width="360" height="40" fill="#1d1f20"/><rect x="560" y="64" width="4" height="40" fill="#18d1ff"/>
  <text x="578" y="89" class="cjk" font-size="13" fill="#fff">订单已交付，获得龙门币 ×2000</text>
  <rect x="560" y="112" width="360" height="40" fill="#1d1f20"/><rect x="560" y="112" width="360" height="6" fill="url(#hz)"/><rect x="560" y="118" width="4" height="34" fill="#ffd802"/>
  <text x="578" y="141" class="cjk" font-size="13" fill="#fff">理智不足，无法开始行动</text>
  <rect x="560" y="160" width="360" height="40" fill="#1d1f20"/><rect x="560" y="160" width="4" height="40" fill="#e33b3b"/>
  <text x="578" y="185" class="cjk" font-size="13" fill="#fff">网络连接中断，请重试</text>

  <!-- 加载 -->
  <text x="560" y="244" class="data tag">03 LOADING</text>
  <text x="640" y="244" class="cjk note">加载：进度条 + 百分比 + 英文状态</text>
  <rect x="560" y="262" width="360" height="2" fill="#fff" fill-opacity=".3"/>
  <rect x="560" y="261" width="234" height="4" fill="#18d1ff"/>
  <text x="560" y="286" class="data" font-size="12" fill="#ababab">LOADING ASSETS...</text>
  <text x="920" y="286" text-anchor="end" class="data" font-size="12" fill="#fff">65%</text>
  <g fill="#fff"><rect x="560" y="304" width="8" height="8" transform="rotate(45 564 308)"/><rect x="578" y="304" width="8" height="8" transform="rotate(45 582 308)" fill-opacity=".6"/><rect x="596" y="304" width="8" height="8" transform="rotate(45 600 308)" fill-opacity=".3"/></g>
  <text x="620" y="313" class="cjk note">菱形点阵循环（估计）</text>

  <!-- 空状态 -->
  <text x="560" y="358" class="data tag">04 EMPTY</text>
  <rect x="560" y="372" width="360" height="48" fill="none" stroke="#585858" stroke-dasharray="4 4"/>
  <text x="740" y="394" text-anchor="middle" class="cond" font-size="13" fill="#ababab" letter-spacing="1">NO DATA</text>
  <text x="740" y="410" text-anchor="middle" class="cjk" font-size="11" fill="#ababab">暂无内容</text>
</svg>

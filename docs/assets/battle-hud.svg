<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">作战 HUD 线框</title>
  <desc id="d">作战界面的信息分区：顶部战况、右上控制、底部干员卡带、右下费用。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #18d1ff; font-size: 12px; }
    .lead { stroke: #18d1ff; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
  </style>
  <rect width="960" height="540" fill="#121212"/>
  <g transform="translate(40 36)">
    <rect width="720" height="405" fill="#2a2d30"/>
    <!-- 等距战场 -->
    <g stroke="#fff" stroke-opacity=".12" fill="none">
      <path d="M150 300 L570 300 L520 120 L200 120 Z"/>
      <path d="M163 255 H557 M175 210 H545 M188 165 H532"/>
      <path d="M234 300 L264 120 M318 300 L328 120 M402 300 L392 120 M486 300 L456 120"/>
    </g>
    <polygon points="234,300 318,300 322,255 241,255" fill="#fff" fill-opacity=".1"/>
    <polygon points="402,255 479,255 472,210 400,210" fill="#18d1ff" fill-opacity=".25"/>
    <rect x="182" y="130" width="26" height="26" fill="#e33b3b" fill-opacity=".8"/>
    <rect x="520" y="262" width="26" height="26" fill="#0098dc" fill-opacity=".9"/>
    <!-- 单位血条 -->
    <rect x="424" y="196" width="34" height="4" fill="#000"/><rect x="424" y="196" width="26" height="4" fill="#4aabea"/>
    <rect x="424" y="201" width="34" height="3" fill="#000"/><rect x="424" y="201" width="18" height="3" fill="#d8dd5a"/>

    <!-- 顶部战况 -->
    <polygon points="278,0 442,0 430,34 290,34" fill="#000" fill-opacity=".6"/>
    <rect x="304" y="10" width="12" height="12" fill="#e33b3b"/><text x="322" y="22" class="data" font-size="14" font-weight="700" fill="#fff">12/47</text>
    <rect x="378" y="10" width="12" height="12" fill="#0098dc"/><text x="396" y="22" class="data" font-size="14" font-weight="700" fill="#fff">3</text>

    <!-- 右上控制 -->
    <rect x="602" y="8" width="34" height="26" fill="#000" fill-opacity=".6"/><text x="619" y="26" text-anchor="middle" class="data" font-size="12" fill="#fff">1X</text>
    <rect x="640" y="8" width="34" height="26" fill="#000" fill-opacity=".6"/><rect x="652" y="15" width="3" height="12" fill="#fff"/><rect x="659" y="15" width="3" height="12" fill="#fff"/>
    <rect x="678" y="8" width="34" height="26" fill="#000" fill-opacity=".6"/><circle cx="695" cy="21" r="5" fill="none" stroke="#fff"/>

    <!-- 底部卡带 -->
    <g>
      <rect x="248" y="338" width="50" height="67" fill="#424242"/><rect x="302" y="338" width="50" height="67" fill="#424242"/>
      <rect x="356" y="338" width="50" height="67" fill="#424242"/><rect x="410" y="328" width="50" height="77" fill="#585858" stroke="#fff"/>
      <rect x="464" y="338" width="50" height="67" fill="#424242"/><rect x="518" y="338" width="50" height="67" fill="#424242" fill-opacity=".45"/>
    </g>
    <g class="data" font-size="10" font-weight="700" fill="#fff">
      <rect x="248" y="338" width="18" height="14" fill="#000"/><text x="252" y="349">12</text>
      <rect x="302" y="338" width="18" height="14" fill="#000"/><text x="306" y="349">19</text>
      <rect x="356" y="338" width="18" height="14" fill="#000"/><text x="360" y="349">21</text>
      <rect x="410" y="328" width="18" height="14" fill="#000"/><text x="414" y="339">9</text>
      <rect x="464" y="338" width="18" height="14" fill="#000"/><text x="468" y="349">14</text>
      <rect x="518" y="338" width="18" height="14" fill="#000"/><text x="522" y="349" fill="#e33b3b">32</text>
    </g>

    <!-- 右下费用 -->
    <polygon points="600,340 720,340 720,405 584,405" fill="#000" fill-opacity=".65"/>
    <text x="618" y="388" class="cond" font-size="14" fill="#ababab">COST</text>
    <text x="706" y="390" text-anchor="end" class="data" font-size="40" font-weight="700" fill="#fff">23</text>
    <rect x="600" y="336" width="120" height="4" fill="#333"/><rect x="600" y="336" width="78" height="4" fill="#fff"/>
    <text x="706" y="330" text-anchor="end" class="data" font-size="10" fill="#fff">剩余可部署 6</text>
    <rect width="720" height="405" fill="none" stroke="#333"/>
  </g>

  <g class="cjk note">
    <path class="lead" d="M400 70 V20 H790"/><text x="796" y="24">① 战况置顶居中：</text><text x="796" y="40">   红 = 敌方进度，蓝 = 我方生命</text>
    <path class="lead" d="M752 58 H790"/><text x="796" y="76">② 控制键成组靠右上，</text><text x="796" y="92">   半透明黑底</text>
    <path class="lead" d="M740 400 H790"/><text x="796" y="396">③ 费用是全屏最大的数字，</text><text x="796" y="412">   上方细条表示回复进度</text>
    <path class="lead" d="M300 441 V480 H340"/><text x="346" y="484">④ 干员卡带：左上角黑底费用，选中项上浮并加白描边，费用不足时卡面压暗、数字转红</text>
    <path class="lead" d="M470 236 V504 H500"/><text x="506" y="508">⑤ 单位头顶：蓝 = 生命，黄绿 = 技力（估计）；可部署格以青蓝半透明高亮</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">作战 HUD 线框</title>
  <desc id="d">作战界面的信息分区：顶部战况、左上设置、右上倍速与暂停、底部干员卡带、右下费用。形状与比例按实机截图画。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #18d1ff; font-size: 12px; }
    .lead { stroke: #18d1ff; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
  </style>
  <rect width="960" height="540" fill="#121212"/>
  <g transform="translate(40 36)">
    <rect width="720" height="405" fill="#2a2d30"/>
    <!-- 等距战场 -->
    <g stroke="#fff" stroke-opacity=".12" fill="none">
      <path d="M150 290 L570 290 L520 110 L200 110 Z"/>
      <path d="M163 245 H557 M175 200 H545 M188 155 H532"/>
      <path d="M234 290 L264 110 M318 290 L328 110 M402 290 L392 110 M486 290 L456 110"/>
    </g>
    <polygon points="234,290 318,290 322,245 241,245" fill="#fff" fill-opacity=".1"/>
    <polygon points="402,245 479,245 472,200 400,200" fill="#18d1ff" fill-opacity=".25"/>
    <rect x="182" y="120" width="26" height="26" fill="#e33b3b" fill-opacity=".8"/>
    <rect x="428" y="160" width="26" height="26" fill="#0098dc" fill-opacity=".9"/>
    <!-- 单位下方的两条细条：紧贴，上面生命、下面技力 -->
    <rect x="424" y="190" width="34" height="3" fill="#000"/><rect x="424" y="190" width="26" height="3" fill="#4aabea"/>
    <rect x="424" y="193" width="34" height="3" fill="#000"/><rect x="424" y="193" width="18" height="3" fill="#d8dd5a"/>

    <!-- 顶部战况：直角矩形的底板，两端和两项之间各一条短竖线 -->
    <rect x="270" y="6" width="180" height="20" fill="#000" fill-opacity=".6"/>
    <path d="M270.5 11v10M360.5 11v10M449.5 11v10" stroke="#fff" stroke-opacity=".7"/>
    <!-- 击杀：橙色的准星 -->
    <g stroke="#ff7800" stroke-width="1.5" fill="none">
      <circle cx="296" cy="16" r="4.5"/>
      <path d="M296 8.5v3M296 20.5v3M288.5 16h3M300.5 16h3"/>
    </g>
    <text x="310" y="20.5" class="data" font-size="12" fill="#fff">12/47</text>
    <!-- 生命：蓝色的塔，数字是浅红 -->
    <path d="M381 22h10v-2h-1.5v-5h1.5v-5h-2.2v1.8h-1.8V10h-2v1.8h-1.8V10H381v5h1.5v5H381z" fill="#0098dc"/>
    <text x="400" y="20.5" class="data" font-size="12" fill="#e88080">3</text>

    <!-- 左上：设置。右上：倍速、暂停。都是约 5rem 见方的深色方块 -->
    <rect x="8" y="8" width="44" height="44" fill="#000" fill-opacity=".6"/>
    <path d="M24 20h12l5 5v10l-5 5H24l-5-5V25zM26 26v8h8v-8z" fill="#fff" fill-rule="evenodd"/>
    <rect x="620" y="8" width="44" height="44" fill="#000" fill-opacity=".6"/>
    <text x="642" y="27" text-anchor="middle" class="data" font-size="13" fill="#fff">2X</text>
    <path d="M633 33l8 5-8 5zM642 33l8 5-8 5z" fill="#fff"/>
    <rect x="668" y="8" width="44" height="44" fill="#000" fill-opacity=".6"/>
    <rect x="683" y="21" width="5" height="18" fill="#fff"/><rect x="692" y="21" width="5" height="18" fill="#fff"/>

    <!-- 底部卡带：约 5:6 的卡片，顶部并排职业图标（浅灰底）和费用（黑底） -->
    <g>
      <rect x="150" y="334" width="59" height="71" fill="#424242"/><rect x="212" y="334" width="59" height="71" fill="#424242"/>
      <rect x="274" y="334" width="59" height="71" fill="#424242"/><rect x="336" y="324" width="59" height="81" fill="#585858" stroke="#fff"/>
      <rect x="398" y="334" width="59" height="71" fill="#424242"/><rect x="460" y="334" width="59" height="71" fill="#424242" fill-opacity=".45"/>
    </g>
    <g class="data" font-size="10" fill="#fff">
      <rect x="165" y="334" width="13" height="13" fill="#d2d2d2"/><rect x="178" y="334" width="16" height="13" fill="#000"/><text x="186" y="344.5" text-anchor="middle">12</text>
      <rect x="227" y="334" width="13" height="13" fill="#d2d2d2"/><rect x="240" y="334" width="16" height="13" fill="#000"/><text x="248" y="344.5" text-anchor="middle">19</text>
      <rect x="289" y="334" width="13" height="13" fill="#d2d2d2"/><rect x="302" y="334" width="16" height="13" fill="#000"/><text x="310" y="344.5" text-anchor="middle">21</text>
      <rect x="351" y="324" width="13" height="13" fill="#d2d2d2"/><rect x="364" y="324" width="16" height="13" fill="#000"/><text x="372" y="334.5" text-anchor="middle">9</text>
      <rect x="413" y="334" width="13" height="13" fill="#d2d2d2"/><rect x="426" y="334" width="16" height="13" fill="#000"/><text x="434" y="344.5" text-anchor="middle">14</text>
      <rect x="475" y="334" width="13" height="13" fill="#8d8d8d"/><rect x="488" y="334" width="16" height="13" fill="#000"/><text x="496" y="344.5" text-anchor="middle" fill="#8d8d8d">32</text>
    </g>

    <!-- 右下费用：直角矩形贴右边；图标 + 数字；回复条在底板下缘；再下面一条写剩余可部署数 -->
    <rect x="630" y="262" width="90" height="24" fill="#000" fill-opacity=".65"/>
    <path d="M650 265.5l8.5 8.5-8.5 8.5-8.5-8.5z" fill="#fff"/>
    <path d="M652.5 270.5h-3.2l-2 2v3l2 2h3.2v-1.8h-2.4l-1-1v-1.4l1-1h2.4z" fill="#000"/>
    <text x="712" y="282" text-anchor="end" class="data" font-size="22" fill="#fff">23</text>
    <rect x="630" y="286" width="90" height="3" fill="#333"/><rect x="630" y="286" width="58" height="3" fill="#fff"/>
    <rect x="606" y="289" width="114" height="17" fill="#000" fill-opacity=".65"/>
    <text x="714" y="301" text-anchor="end" class="cjk" font-size="9" fill="#fff">剩余可放置角色：6</text>
    <rect width="720" height="405" fill="none" stroke="#333"/>
  </g>

  <g class="cjk note">
    <path class="lead" d="M400 60 V20 H790"/><text x="796" y="24">① 战况置顶居中：直角矩形，</text><text x="796" y="40">   橙 = 击杀，蓝 = 生命，</text><text x="796" y="56">   生命点数的数字是浅红</text>
    <path class="lead" d="M752 68 H790"/><text x="796" y="86">② 倍速、暂停是右上角两块</text><text x="796" y="102">   5rem 的方块；设置在左上</text>
    <path class="lead" d="M762 310 H790"/><text x="796" y="306">③ 费用是全屏最大的数字</text><text x="796" y="322">   （战况数字的 2 倍），</text><text x="796" y="338">   回复条在底板下缘</text>
    <path class="lead" d="M260 441 V480 H300"/><text x="306" y="484">④ 干员卡带：顶部并排职业图标和费用，选中项上浮并加白描边，费用不足时卡面压暗、数字变灰</text>
    <path class="lead" d="M470 232 V504 H500"/><text x="506" y="508">⑤ 单位下方：蓝 = 生命，黄绿 = 技力，两条紧贴；可部署格以青蓝半透明高亮（估计）</text>
  </g>
</svg>

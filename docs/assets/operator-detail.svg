<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">干员详情线框</title>
  <desc id="d">干员详情页的布局：左侧属性、中间立绘、右侧名称与养成入口，所有操作不离开同一张画布。</desc>
  <style>
    .cond { font-family: 'Oswald','Bahnschrift','Arial Narrow',Arial,sans-serif; font-weight: 500; }
    .wide { font-family: 'Novecento Sans Wide','Novecento Wide','Montserrat','Segoe UI',Arial,sans-serif; font-weight: 700; }
    .cjk { font-family: 'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    .data { font-family: 'Bender','JetBrains Mono',Consolas,monospace; }
    .note { fill: #18d1ff; font-size: 12px; }
    .lead { stroke: #18d1ff; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
  </style>
  <defs>
    <symbol id="fig" viewBox="0 0 100 200"><path d="M50 8 C66 8 76 22 74 40 C73 50 68 56 64 60 C84 70 96 110 98 200 H2 C4 110 16 70 36 60 C32 56 27 50 26 40 C24 22 34 8 50 8 Z"/></symbol>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fff" fill-opacity=".18"/></pattern>
    <clipPath id="frame"><rect width="720" height="405"/></clipPath>
  </defs>
  <rect width="960" height="540" fill="#121212"/>
  <g transform="translate(40 36)">
    <rect width="720" height="405" fill="#26282b"/>
    <g clip-path="url(#frame)">
      <rect x="0" y="260" width="300" height="145" fill="url(#dots)"/>
      <text x="150" y="330" class="cond" font-size="150" fill="#fff" fill-opacity=".04" letter-spacing="-7">GUARD</text>
      <use href="#fig" x="230" y="20" width="250" height="500" fill="#8d8d8d"/>
    </g>

    <!-- 顶部导航 -->
    <polygon points="0,0 70,0 58,26 0,26" fill="#313131"/><path d="M30 8 L22 13 L30 18" stroke="#fff" stroke-width="2" fill="none"/>
    <polygon points="74,0 124,0 112,26 62,26" fill="#424242"/>

    <!-- 左：属性 -->
    <g class="cjk" font-size="10" fill="#d2d2d2">
      <text x="24" y="150">生命上限</text><text x="24" y="170">攻击</text><text x="24" y="190">防御</text><text x="24" y="210">法术抗性</text>
    </g>
    <g class="data" font-size="12" font-weight="700" fill="#fff" text-anchor="end">
      <text x="150" y="150">2480</text><text x="150" y="170">612</text><text x="150" y="190">402</text><text x="150" y="210">0</text>
    </g>
    <g fill="#fff" fill-opacity=".25"><rect x="24" y="154" width="126" height="2"/><rect x="24" y="174" width="126" height="2"/><rect x="24" y="194" width="126" height="2"/><rect x="24" y="214" width="126" height="2"/></g>
    <g fill="#fff"><rect x="24" y="154" width="96" height="2"/><rect x="24" y="174" width="70" height="2"/><rect x="24" y="194" width="52" height="2"/></g>
    <text x="24" y="246" class="cjk" font-size="10" fill="#d2d2d2">攻击范围</text>
    <g fill="none" stroke="#fff" stroke-opacity=".6"><rect x="24" y="254" width="14" height="14" fill="#fff"/><rect x="40" y="254" width="14" height="14"/><rect x="56" y="254" width="14" height="14"/><rect x="40" y="238" width="14" height="14" stroke-opacity=".25"/><rect x="40" y="270" width="14" height="14" stroke-opacity=".25"/></g>
    <rect x="24" y="300" width="126" height="26" fill="#000" fill-opacity=".5"/>
    <text x="32" y="317" class="cjk" font-size="10" fill="#fff">信赖</text><text x="142" y="318" text-anchor="end" class="data" font-size="12" fill="#ff5e19">200%</text>

    <!-- 右：名称 + 等级 -->
    <g fill="#f1c644"><rect x="500" y="92" width="8" height="8" transform="rotate(45 504 96)"/><rect x="514" y="92" width="8" height="8" transform="rotate(45 518 96)"/><rect x="528" y="92" width="8" height="8" transform="rotate(45 532 96)"/><rect x="542" y="92" width="8" height="8" transform="rotate(45 546 96)"/><rect x="556" y="92" width="8" height="8" transform="rotate(45 560 96)"/><rect x="570" y="92" width="8" height="8" transform="rotate(45 574 96)"/></g>
    <text x="500" y="126" class="wide" font-size="11" fill="#fff">CODENAME</text>
    <text x="498" y="166" class="cjk" font-size="36" font-weight="900" fill="#fff" letter-spacing="-3.6">干员代号</text>
    <polygon points="500,178 548,178 554,184 554,198 500,198" fill="#fff"/><text x="527" y="192" text-anchor="middle" class="cjk" font-size="10" font-weight="700" fill="#000">近卫</text>
    <rect x="560" y="178" width="46" height="20" fill="none" stroke="#fff" stroke-opacity=".5"/><text x="583" y="192" text-anchor="middle" class="cjk" font-size="10" fill="#fff">输出</text>

    <circle cx="536" cy="258" r="34" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="5"/>
    <path d="M536 224 A34 34 0 1 1 505 272" fill="none" stroke="#ffd802" stroke-width="5"/>
    <text x="536" y="254" text-anchor="middle" class="cond" font-size="9" fill="#ababab">LV</text>
    <text x="536" y="276" text-anchor="middle" class="data" font-size="24" font-weight="700" fill="#fff">90</text>
    <polygon points="594,234 620,282 568,282" transform="translate(30 0)" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="624" y="300" text-anchor="middle" class="cond" font-size="9" fill="#ababab">ELITE 2</text>

    <g><rect x="500" y="318" width="60" height="60" fill="#000" fill-opacity=".5" stroke="#fff" stroke-opacity=".3"/><rect x="566" y="318" width="60" height="60" fill="#000" fill-opacity=".5" stroke="#fff" stroke-opacity=".3"/><rect x="632" y="318" width="60" height="60" fill="#000" fill-opacity=".5" stroke="#18d1ff"/></g>
    <g class="data" font-size="9" fill="#fff"><text x="504" y="374">RANK 7</text><text x="570" y="374">RANK 7</text><text x="636" y="374" fill="#18d1ff">M3</text></g>
    <rect width="720" height="405" fill="none" stroke="#333"/>
  </g>

  <g class="cjk note">
    <path class="lead" d="M660 200 H790"/><text x="796" y="196">① 英文在上、中文代号在下；</text><text x="796" y="212">   Heavy 字重，字距 -0.1em</text>
    <path class="lead" d="M616 294 H790"/><text x="796" y="290">② 等级用环形进度，</text><text x="796" y="306">   数字居中</text>
    <path class="lead" d="M732 384 H790"/><text x="796" y="380">③ 技能格：黑半透明方块，</text><text x="796" y="396">   当前选中用青蓝描边</text>
    <path class="lead" d="M120 366 V480 H160"/><text x="166" y="484">④ 属性：标签在左、数值右对齐，下方 2px 条表示在同职业中的相对高低</text>
    <path class="lead" d="M395 441 V504 H420"/><text x="426" y="508">⑤ 立绘居中出血；背后放巨型职业英文与半调网点；进入子功能时立绘横移而不是换页</text>
  </g>
</svg>
